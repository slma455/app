<div class="w-75 m-auto my-5">
  <h1>Register Now</h1>
  <form [formGroup]="register" (ngSubmit)="onSubmit()">
    <input [ngClass] ="{
  'is-invalid': register.get('name')?.errors &&(register.get('name')?.touched || register.get('name')?.dirty),
  'is-valid': !register.get('name')?.errors &&(register.get('name')?.touched || register.get('name')?.dirty)
    }"
     formControlName="name"  type="text" class="form-control my-3 " placeholder="Enter your Name">
    <alertError [formName]="register" [controlName]="'name'" />

    <input formControlName="email" type="email" class="form-control my-3" placeholder="Enter your Email">
    <alertError [formName]="register" [controlName]="'email'" />

    <input formControlName="password" type="password" class="form-control my-3" placeholder="Enter your Password">
     <alertError [formName]="register" [controlName]="'password'" label="Password" />
    <input formControlName="rePassword" type="password" class="form-control my-3" placeholder="Confirm Password">
         <alertError [formName]="register" [controlName]="'rePassword'" label="Confirm Password" />


       <button type="submit" [disabled]="!register.valid" class="bg-main text-white btn">Register</button>
  </form>
</div>
